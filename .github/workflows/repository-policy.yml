name: Règles du dépôt

# Les règles de `tools/ci-policy` (workflows durcis, documents légaux, copies
# de la V2 dans la version multiplateforme…) et le contrôle de la distribution
# Gradle, utilisée aussi par la version multiplateforme. Ils tournaient dans le
# workflow de la V2, qui n'est plus lancé automatiquement : ils restent ici
# sur chaque push et chaque pull request, sans construire d'APK.
on:
  push:
    branches: [main, master, develop, "claude/**", "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Règles du dépôt
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Le wrapper versionné s'exécute avant tout le reste : il est comparé
      # aux empreintes publiées par Gradle avant d'être lancé.
      - name: Valider le wrapper Gradle
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Installer Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurer Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-provider: basic

      # Le wrapper valide, la distribution qu'il télécharge reste à contrôler.
      # `distributionSha256Sum` s'en charge à chaque exécution, sur le poste des
      # développeurs comme ici : le wrapper refuse une archive dont l'empreinte
      # diffère. Reste à s'assurer que la valeur inscrite dans le dépôt est bien
      # celle que Gradle publie — sans quoi on épinglerait avec conviction une
      # archive substituée. Cette étape compare les deux.
      - name: Contrôler l'empreinte de la distribution Gradle
        run: |
          properties=gradle/wrapper/gradle-wrapper.properties
          url="$(sed -n 's/^distributionUrl=//p' "$properties" | sed 's/\\//g')"
          attendu="$(sed -n 's/^distributionSha256Sum=//p' "$properties")"

          if [[ -z "$attendu" ]]; then
            echo "::error::distributionSha256Sum absent de $properties : la distribution Gradle n'est pas épinglée. Voir CONTRIBUTING.md."
            exit 1
          fi

          # Empreinte publiée par Gradle à côté de l'archive. Une panne réseau ne
          # doit pas faire échouer la construction : le wrapper vérifie déjà
          # l'archive localement, ce contrôle-ci porte sur la déclaration.
          officiel="$(curl -fsSL --retry 3 --max-time 30 "$url.sha256" || true)"
          if [[ -z "$officiel" ]]; then
            echo "::notice::Empreinte officielle indisponible ($url.sha256), comparaison ignorée."
            exit 0
          fi

          if [[ "${attendu,,}" != "${officiel,,}" ]]; then
            echo "::error::distributionSha256Sum ($attendu) ne correspond pas à l'empreinte publiée par Gradle ($officiel)."
            exit 1
          fi
          echo "Distribution Gradle épinglée sur l'empreinte publiée par Gradle."

      - name: Règles du dépôt
        run: ./gradlew :tools:ci-policy:test --stacktrace
