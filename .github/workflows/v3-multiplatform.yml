name: RavenEmu V3 Multiplatform
on:
  push:
    branches: [feature/v3-multiplatform]
    paths:
      - "v3/**"
      - ".github/workflows/v3-multiplatform.yml"
  pull_request:
    paths:
      - "v3/**"
      - ".github/workflows/v3-multiplatform.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: V3 Android shared UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Verify Android SDK from runner image
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            echo "::error::Android SDK not available on runner"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          if [ ! -d "$SDK_ROOT/platforms/android-37" ]; then
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37"
          fi
      - name: Build Android preview
        run: ./gradlew -p v3 :androidApp:assembleDebug --stacktrace

  ios:
    name: V3 iOS shared framework
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Verify Android SDK from runner image
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            echo "::error::Android SDK not available on runner"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          if [ ! -d "$SDK_ROOT/platforms/android-37" ]; then
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37"
          fi
      - name: Build iOS simulator framework
        run: ./gradlew -p v3 :shared:linkDebugFrameworkIosSimulatorArm64 --stacktrace
