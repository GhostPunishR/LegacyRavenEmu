name: RavenEmu V3 Multiplatform
on:
  push:
    branches: [feature/v3-multiplatform]
    paths:
      - "v3/**"
      - ".github/workflows/v3-multiplatform.yml"
  pull_request:
    paths:
      - "v3/**"
      - ".github/workflows/v3-multiplatform.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: V3 Android shared UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build Android preview
        run: ./gradlew -p v3 :androidApp:assembleDebug --stacktrace

  ios:
    name: V3 iOS shared framework
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build iOS simulator framework
        run: ./gradlew -p v3 :shared:linkDebugFrameworkIosSimulatorArm64 --stacktrace
