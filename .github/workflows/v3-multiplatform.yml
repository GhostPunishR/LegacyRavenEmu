name: RavenEmu V3 Multiplatform
on:
  push:
    branches: [feature/v3-multiplatform]
    paths:
      - "v3/**"
      - ".github/workflows/v3-multiplatform.yml"
  pull_request:
    paths:
      - "v3/**"
      - ".github/workflows/v3-multiplatform.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: V3 Android shared UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build Android preview
        run: ./gradlew -p v3 :androidApp:assembleDebug --stacktrace
      - name: Publish unsigned preview APK
        uses: actions/upload-artifact@v4
        with:
          name: ravenemu-v3-android-preview
          path: v3/androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  ios:
    name: V3 iOS shared framework
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build iOS simulator framework
        run: ./gradlew -p v3 :shared:linkDebugFrameworkIosSimulatorArm64 --stacktrace
      - name: Cross-compile native emulator SDK for iOS simulator
        run: sh v3/native/build-ios.sh
