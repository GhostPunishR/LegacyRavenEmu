name: RavenEmu Multiplateforme
on:
  push:
    branches: [main, feature/v3-multiplatform]
    paths:
      - "multiplateforme/**"
      - ".github/workflows/multiplateforme.yml"
  pull_request:
    paths:
      - "multiplateforme/**"
      - ".github/workflows/multiplateforme.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android (APK bêta)
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Le wrapper versionné s'exécute avant tout le reste : il est comparé
      # aux empreintes publiées par Gradle, comme dans le workflow Android.
      - name: Valider le wrapper Gradle
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - name: Installer Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Construire l'APK bêta
        run: ./gradlew -p multiplateforme :androidApp:assembleDebug --stacktrace
      - name: Tests Android
        run: ./gradlew -p multiplateforme :androidApp:testDebugUnitTest --stacktrace
      - name: Publier l'APK bêta
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ravenemu-android-beta
          path: multiplateforme/androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  ios:
    name: iOS (framework partagé)
    runs-on: macos-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Le wrapper versionné s'exécute avant tout le reste : il est comparé
      # aux empreintes publiées par Gradle, comme dans le workflow Android.
      - name: Valider le wrapper Gradle
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - name: Installer Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Build iOS simulator framework
        run: ./gradlew -p multiplateforme :shared:linkDebugFrameworkIosSimulatorArm64 --stacktrace
      - name: Cross-compile native emulator SDK for iOS simulator
        run: sh multiplateforme/native/build-ios.sh
